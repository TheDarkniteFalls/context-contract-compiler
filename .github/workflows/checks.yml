name: checks

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -B metadata_retrieval_demo.py --self-test
      - run: python3 -B metadata_retrieval_demo.py failures
      - run: python3 -B -m unittest discover -s tests -v
      - run: python3 -B -m py_compile metadata_retrieval_demo.py tests/test_metadata_retrieval_demo.py
